name: Generate resume PDFs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/generate-resume-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/resume-preview.log 2>&1 &
          echo $! > /tmp/resume-preview.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/fr > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/resume-preview.log
          exit 1

      - name: Install Chromium for PDF generation
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Generate vector PDFs
        run: |
          mkdir -p resume
          npx -y playwright@1.55.0 pdf --paper-format A4 http://127.0.0.1:4173/fr resume/Sabrina-Heydel-AI-Product-Builder-CV-FR.pdf
          npx -y playwright@1.55.0 pdf --paper-format A4 http://127.0.0.1:4173/en resume/Sabrina-Heydel-AI-Product-Builder-Resume-EN.pdf

      - name: Commit refreshed PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/*.pdf
          if git diff --cached --quiet; then
            echo "PDFs are already up to date."
          else
            git commit -m "docs: refresh downloadable resume PDFs [skip ci]"
            git push
          fi
